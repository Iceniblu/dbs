name: Keep Supabase awake

# Supabase free projects pause after about a week of inactivity.
# This runs a trivial query every 3 days so that never happens.
on:
  schedule:
    - cron: "17 19 */3 * *" # 19:17 UTC, roughly 6am Sydney, every 3rd day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          : "${DATABASE_URL:?DATABASE_URL is not set}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select 'ok ' || now()"
